<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url("/static/imagenes/uyuni1.jpg"); /* Cambia 'ruta/a/tu/imagen.jpg' por la ruta de tu imagen */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .overlay {
            background-color: rgba(0, 0, 0, 0.5); /* Fondo opaco */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .card {
            z-index: 2;
            background-color: rgba(255, 255, 255, 0.9); /* Fondo del card con opacidad */
        }
        .password-toggle {
            cursor: pointer;
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-header text-center">
                        <h3>Cambiar Contraseña</h3>
                    </div>
                    <div class="card-body">
                        <!-- Mostrar mensajes de éxito o error -->
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ category }}">
                                        {{ message }}
                                    </div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <form method="POST" action="/restablecer_contraseña/{{ token }}">
                            <div class="form-group">
                                <label for="nueva_contraseña">Nueva Contraseña</label>
                                <div style="position: relative;">
                                    <input type="password" class="form-control" id="nueva_contraseña" name="contraseña" placeholder="Introduce tu nueva contraseña" required>
                                    <span class="password-toggle" onclick="togglePassword('nueva_contraseña')">👁️</span>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="confirmar_contraseña">Confirmar Contraseña</label>
                                <div style="position: relative;">
                                    <input type="password" class="form-control" id="confirmar_contraseña" name="confirmacion_contraseña" placeholder="Confirma tu nueva contraseña" required>
                                    <span class="password-toggle" onclick="togglePassword('confirmar_contraseña')">👁️</span>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Cambiar Contraseña</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies (Popper.js and jQuery) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }
    </script>
</body>
</html>
