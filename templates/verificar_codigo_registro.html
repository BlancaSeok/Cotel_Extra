<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Código</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        :root {
            --naranja-oscuro: #b8480f;
            --naranja-base:   #e0621c;
            --naranja-brillo: #f5813a;
            --naranja-claro:  #ffb066;
            --carbon:         #1c1410;
            --crema:          #fff3e6;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
            color: var(--crema);
            background: linear-gradient(135deg, var(--carbon) 0%, #2b1608 30%, var(--naranja-oscuro) 65%, var(--naranja-base) 100%);
            background-size: 300% 300%;
            animation: derivaNaranja 16s ease-in-out infinite;
            position: relative;
        }

        @keyframes derivaNaranja {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Señal de fibra óptica: líneas que laten de fondo, evocando pulsos de red */
        body::before,
        body::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-repeat: no-repeat;
        }

        body::before {
            background:
                radial-gradient(circle at 15% 20%, rgba(245,129,58,0.35) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(224,98,28,0.30) 0%, transparent 50%);
            animation: pulso 7s ease-in-out infinite alternate;
        }

        body::after {
            background-image: repeating-linear-gradient(
                115deg,
                rgba(255,176,102,0.06) 0px,
                rgba(255,176,102,0.06) 2px,
                transparent 2px,
                transparent 90px
            );
            animation: barrido 9s linear infinite;
        }

        @keyframes pulso {
            0%   { opacity: 0.55; }
            100% { opacity: 1; }
        }

        @keyframes barrido {
            0%   { transform: translateX(0); }
            100% { transform: translateX(180px); }
        }

        .verificar-codigo-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            background: rgba(28, 20, 16, 0.55);
            border: 1px solid rgba(255, 176, 102, 0.35);
            border-radius: 16px;
            padding: 40px 36px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow:
                0 20px 45px rgba(0, 0, 0, 0.45),
                0 0 0 1px rgba(255, 255, 255, 0.03) inset;
        }
        .logo-cotel{
            display:block;
            width:170px;
            max-width:90%;
            height:auto;
            margin:0 auto 25px auto;
            object-fit:contain;
            filter:drop-shadow(0 8px 20px rgba(0,0,0,.35));
        }

        .icono-senal {
            width: 56px;
            height: 56px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--naranja-brillo), var(--naranja-oscuro));
            box-shadow: 0 0 22px rgba(245, 129, 58, 0.55);
        }

        .icono-senal svg {
            width: 28px;
            height: 28px;
        }

        h2 {
            text-align: center;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 0.02em;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .subtitulo {
            text-align: center;
            font-size: 0.88rem;
            color: rgba(255, 243, 230, 0.65);
            margin-bottom: 26px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: var(--naranja-claro);
            margin-bottom: 8px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 176, 102, 0.3);
            color: #ffffff;
            border-radius: 10px;
            padding: 12px 14px;
            letter-spacing: 0.35em;
            text-align: center;
            font-size: 1.15rem;
            text-transform: uppercase;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .form-control::placeholder {
            letter-spacing: normal;
            text-transform: none;
            font-size: 0.85rem;
            color: rgba(255, 243, 230, 0.4);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--naranja-brillo);
            box-shadow: 0 0 0 3px rgba(245, 129, 58, 0.25);
            outline: none;
            color: #ffffff;
        }

        .btn-primary {
            width: 100%;
            margin-top: 22px;
            padding: 12px 14px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            letter-spacing: 0.03em;
            background: linear-gradient(135deg, var(--naranja-brillo), var(--naranja-oscuro));
            box-shadow: 0 8px 20px rgba(184, 72, 15, 0.45);
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }

        .btn-primary:hover,
        .btn-primary:focus {
            transform: translateY(-1px);
            filter: brightness(1.08);
            box-shadow: 0 10px 26px rgba(184, 72, 15, 0.55);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .alert {
            border-radius: 10px;
            border: none;
            font-size: 0.9rem;
            padding: 10px 14px;
        }

        .alert-danger   { background: rgba(220, 53, 69, 0.85); color: #fff; }
        .alert-success  { background: rgba(40, 167, 69, 0.85); color: #fff; }
        .alert-warning  { background: rgba(255, 193, 7, 0.9);  color: #2b1608; }
        .alert-info     { background: rgba(23, 162, 184, 0.85); color: #fff; }

        @media (prefers-reduced-motion: reduce) {
            body, body::before, body::after {
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="verificar-codigo-container">
        <img src="{{ url_for('static', filename='imagenes/Logo1Cotel.png') }}"
         alt="Logo COTEL RL"
         class="logo-cotel">

        <h2>Verificar Código de Registro</h2>
        <p class="subtitulo">Ingresa el código de 6 caracteres que enviamos a tu cuenta</p>

        <!-- Mensajes Flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div>
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label for="codigo">Código de Verificación</label>
                <input type="text" class="form-control" id="codigo" name="codigo" required
                       pattern="[A-Za-z0-9]{6}" maxlength="6"
                       placeholder="Ej: A3F9K1"
                       title="El código debe tener 6 caracteres alfanuméricos.">
            </div>
            <button type="submit" class="btn btn-primary" aria-label="Verificar código de registro">
                Verificar código
            </button>
        </form>
    </div>
</body>
</html>
